<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Dashboard — GOG</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages/dashboard.css">
</head>
<body data-page="club-dashboard">

  <div id="navbar-placeholder"></div>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar__profile">
        <div class="avatar avatar--lg avatar-placeholder" id="club-logo-placeholder" style="width:72px;height:72px;margin:0 auto;font-size:2rem;border-radius:var(--radius-btn)">🏟</div>
        <img id="club-logo" src="" alt="" class="avatar avatar--lg" style="display:none;margin:0 auto;border-radius:var(--radius-btn)">
        <div class="sidebar__name" id="club-name">Club Name</div>
        <div class="sidebar__role" id="club-country" style="font-size:0.8rem;color:var(--text-secondary)">Loading…</div>
        <div style="margin-top:var(--sp-2)" id="club-verified-badge"></div>
      </div>

      <nav class="sidebar__nav">
        <a href="#" class="sidebar__link active" data-section="search" onclick="showSection('search',this)">
          <span>🔍</span> Find Players
        </a>
        <a href="#" class="sidebar__link" data-section="saved" onclick="showSection('saved',this)">
          <span>🔖</span> Saved Players
        </a>
        <a href="#" class="sidebar__link" data-section="requests" onclick="showSection('requests',this)">
          <span>📤</span> Sent Requests
        </a>
        <div class="divider"></div>
        <a href="/login.html" class="sidebar__link" onclick="handleLogout();return false">
          <span>🚪</span> Logout
        </a>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="dashboard-main">

      <!-- SECTION: Player Search -->
      <section id="section-search" class="dashboard-section">
        <div class="page-header">
          <h1 class="page-header__title">Find Players</h1>
          <p class="page-header__subtitle">Search and filter from our verified player database.</p>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="form-group">
            <label class="form-label">Position</label>
            <select class="form-select" id="filter-position">
              <option value="">All Positions</option>
              <option value="GK">GK — Goalkeeper</option>
              <option value="CB">CB — Centre Back</option>
              <option value="LB">LB — Left Back</option>
              <option value="RB">RB — Right Back</option>
              <option value="CDM">CDM — Defensive Mid</option>
              <option value="CM">CM — Central Mid</option>
              <option value="CAM">CAM — Attacking Mid</option>
              <option value="LW">LW — Left Wing</option>
              <option value="RW">RW — Right Wing</option>
              <option value="ST">ST — Striker</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Nationality</label>
            <input class="form-input" type="text" id="filter-nationality" placeholder="e.g. Brazilian">
          </div>
          <div class="form-group">
            <label class="form-label">Preferred Foot</label>
            <select class="form-select" id="filter-foot">
              <option value="">Any</option>
              <option value="left">Left</option>
              <option value="right">Right</option>
              <option value="both">Both</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Age Min</label>
            <input class="form-input" type="number" id="filter-age-min" placeholder="16" min="14" max="45">
          </div>
          <div class="form-group">
            <label class="form-label">Age Max</label>
            <input class="form-input" type="number" id="filter-age-max" placeholder="35" min="14" max="45">
          </div>
          <div class="form-group">
            <label class="form-label">Min Height (cm)</label>
            <input class="form-input" type="number" id="filter-height-min" placeholder="160" min="150" max="220">
          </div>
          <div style="align-self:flex-end">
            <button id="search-btn" class="btn btn--primary">Search</button>
          </div>
        </div>

        <div class="search-header">
          <span class="results-count" id="results-count">Loading…</span>
          <button class="btn btn--ghost btn--sm" onclick="clearFilters()">Clear Filters</button>
        </div>

        <div class="grid-auto" id="players-grid">
          <div class="flex-center" style="padding:var(--sp-16);grid-column:1/-1">
            <div class="loader"></div>
          </div>
        </div>

        <div id="pagination"></div>
      </section>

      <!-- SECTION: Saved Players -->
      <section id="section-saved" class="dashboard-section" style="display:none">
        <div class="page-header">
          <h1 class="page-header__title">Saved Players</h1>
          <p class="page-header__subtitle">Players you've bookmarked for easy access.</p>
        </div>
        <div id="saved-players">
          <div class="flex-center" style="padding:var(--sp-16)">
            <div class="loader"></div>
          </div>
        </div>
      </section>

      <!-- SECTION: Sent Requests -->
      <section id="section-requests" class="dashboard-section" style="display:none">
        <div class="page-header">
          <h1 class="page-header__title">Contact Requests</h1>
          <p class="page-header__subtitle">Track the status of your outgoing player contact requests.</p>
        </div>
        <div id="sent-requests">
          <div class="flex-center" style="padding:var(--sp-16)">
            <div class="loader"></div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="/js/components.js"></script>
  <script src="/js/club.js"></script>
  <script>
    function showSection(name, linkEl) {
      document.querySelectorAll('.dashboard-section').forEach(s => s.style.display = 'none');
      document.querySelectorAll('.sidebar__link').forEach(l => l.classList.remove('active'));
      document.getElementById(`section-${name}`).style.display = 'block';
      linkEl.classList.add('active');

      if (name === 'saved')    loadSavedPlayers();
      if (name === 'requests') loadSentRequests();
    }

    function clearFilters() {
      ['filter-position','filter-nationality','filter-foot','filter-age-min','filter-age-max','filter-height-min'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      searchPlayers(1);
    }

    // Load club info for sidebar
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const club = await apiRequest('/api/club/profile.php');
        document.getElementById('club-name').textContent = club.club_name;
        document.getElementById('club-country').textContent = `${club.country}${club.league_division ? ' · ' + club.league_division : ''}`;
        document.getElementById('club-verified-badge').innerHTML = verifiedBadge();
        if (club.logo_url) {
          const img = document.getElementById('club-logo');
          img.src = club.logo_url;
          img.style.display = 'block';
          document.getElementById('club-logo-placeholder').style.display = 'none';
        }
      } catch { /* handled by club.js auth check */ }
    });
  </script>

</body>
</html>
