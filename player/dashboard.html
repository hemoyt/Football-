<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Player dashboard — GOG Gateway of Goals." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>Player Dashboard — GOG</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages/dashboard.css" />

  <style>
    /* ── Navbar strip ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: var(--z-nav);
      background: rgba(10,10,10,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 var(--sp-6);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar__logo {
      font-family: var(--font-display);
      font-size: 2rem;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }

    .topbar__right {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
    }

    .topbar__greeting {
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    /* ── Sidebar avatar area ── */
    .sidebar__profile {
      text-align: center;
      padding-bottom: var(--sp-6);
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--sp-6);
    }

    .sidebar-avatar-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: var(--sp-3);
    }

    #sidebar-photo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--gold-dim);
      display: block;
    }

    .avatar-placeholder {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 3px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-dim);
      font-size: 2rem;
    }

    .sidebar__name {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--text-primary);
      display: block;
      margin-bottom: var(--sp-1);
    }

    .sidebar__position {
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: block;
    }

    /* ── Stats row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--sp-4);
      margin-bottom: var(--sp-8);
    }

    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: var(--sp-6);
      text-align: center;
      transition: border-color var(--transition-base), box-shadow var(--transition-base);
    }

    .stat-card:hover {
      border-color: var(--gold-dim);
      box-shadow: var(--shadow-gold);
    }

    .stat-card__number {
      font-family: var(--font-display);
      font-size: 2.8rem;
      color: var(--gold-primary);
      line-height: 1;
      margin-bottom: var(--sp-2);
    }

    .stat-card__label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    /* Completion ring card */
    .stat-card--ring {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-3);
    }

    /* Progress ring */
    .progress-ring {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .progress-ring svg {
      transform: rotate(-90deg);
    }

    .progress-ring__bg {
      fill: none;
      stroke: var(--border);
      stroke-width: 6;
    }

    .progress-ring__fill {
      fill: none;
      stroke: var(--gold-primary);
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset var(--transition-slow);
    }

    .progress-ring__label {
      position: absolute;
      font-family: var(--font-display);
      font-size: 1rem;
      color: var(--gold-primary);
    }

    /* Active badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .status-badge--active {
      background: rgba(30,132,73,0.15);
      color: #27ae60;
      border: 1px solid rgba(30,132,73,0.3);
    }

    .status-badge__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      gap: var(--sp-1);
      margin-bottom: var(--sp-6);
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 20px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--text-primary);
    }

    .tab-btn.active {
      color: var(--gold-primary);
      border-bottom-color: var(--gold-primary);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    /* ── Videos grid ── */
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--sp-4);
      margin-bottom: var(--sp-4);
    }

    /* ── Chart placeholder ── */
    .chart-placeholder {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: var(--sp-8);
      text-align: center;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-3);
    }

    .chart-placeholder__icon {
      font-size: 3rem;
      color: var(--gold-dim);
    }

    .chart-placeholder__label {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* ── Page header ── */
    .page-header {
      margin-bottom: var(--sp-8);
    }

    .page-header__title {
      font-family: var(--font-display);
      font-size: 2.2rem;
      color: var(--text-primary);
      margin-bottom: var(--sp-1);
    }

    .page-header__subtitle {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .stats-row {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .stats-row {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 0 var(--sp-4);
      }
    }
  </style>
</head>
<body data-page="player-dashboard">

  <!-- Top navigation bar -->
  <header class="topbar" role="banner">
    <a href="/index.html" class="topbar__logo" aria-label="GOG — Gateway of Goals home">GOG</a>
    <div class="topbar__right">
      <span class="topbar__greeting" id="topbar-greeting" aria-live="polite"></span>
      <a href="/login.html" class="btn btn--ghost btn--sm">Sign Out</a>
    </div>
  </header>

  <!-- Dashboard layout: sidebar + main -->
  <div class="dashboard-layout">

    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Player sidebar">

      <div class="sidebar__profile">
        <div class="sidebar-avatar-wrap">
          <img
            id="sidebar-photo"
            src=""
            alt="Your profile photo"
            hidden
          />
          <div class="avatar-placeholder" id="sidebar-photo-placeholder" aria-hidden="true">&#9917;</div>
        </div>
        <span id="sidebar-name" class="sidebar__name"></span>
        <span id="sidebar-position" class="sidebar__position"></span>
      </div>

      <nav class="sidebar__nav" aria-label="Player navigation">
        <a href="/player/dashboard.html" class="sidebar__link active" aria-current="page">
          <span aria-hidden="true">&#9741;</span>
          Dashboard
        </a>
        <a href="/player/profile.html" class="sidebar__link">
          <span aria-hidden="true">&#128100;</span>
          My Profile
        </a>
        <a href="#tab-videos" class="sidebar__link" id="nav-videos-link">
          <span aria-hidden="true">&#127910;</span>
          My Videos
        </a>
        <a href="/login.html" class="sidebar__link">
          <span aria-hidden="true">&#128274;</span>
          Settings
        </a>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="dashboard-main" id="main-content">

      <div class="page-header">
        <h1 class="page-header__title">Player Dashboard</h1>
        <p class="page-header__subtitle">Track your visibility and manage your presence on GOG</p>
      </div>

      <!-- Stats row -->
      <div class="stats-row" role="region" aria-label="Profile statistics">

        <div class="stat-card" id="stat-profile-views">
          <div class="stat-card__number" id="profile-views" aria-live="polite">—</div>
          <div class="stat-card__label">Profile Views</div>
        </div>

        <div class="stat-card">
          <div class="stat-card__number" id="total-requests" aria-live="polite">—</div>
          <div class="stat-card__label">Contact Requests</div>
        </div>

        <div class="stat-card stat-card--ring">
          <div id="completion-ring" class="progress-ring" aria-label="Profile completion">
            <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
              <circle class="progress-ring__bg" cx="36" cy="36" r="30" />
              <circle
                class="progress-ring__fill"
                cx="36"
                cy="36"
                r="30"
                stroke-dasharray="188.5"
                stroke-dashoffset="188.5"
                id="completion-ring-fill"
              />
            </svg>
            <span class="progress-ring__label" id="completion-pct" aria-live="polite">0%</span>
          </div>
          <div class="stat-card__label">Profile Completion</div>
        </div>

        <div class="stat-card">
          <div class="stat-card__number" style="font-size: 1.2rem; padding-top: var(--sp-3);">
            <span class="status-badge status-badge--active">
              <span class="status-badge__dot"></span>
              Active
            </span>
          </div>
          <div class="stat-card__label" style="margin-top: var(--sp-3);">Account Status</div>
        </div>

      </div>

      <!-- Tabs -->
      <div class="tabs" role="tablist" aria-label="Dashboard sections">
        <button
          class="tab-btn active"
          role="tab"
          aria-selected="true"
          aria-controls="tab-requests"
          data-panel="tab-requests"
          id="tab-btn-requests"
        >
          Contact Requests
        </button>
        <button
          class="tab-btn"
          role="tab"
          aria-selected="false"
          aria-controls="tab-videos"
          data-panel="tab-videos"
          id="tab-btn-videos"
        >
          My Videos
        </button>
        <button
          class="tab-btn"
          role="tab"
          aria-selected="false"
          aria-controls="tab-stats"
          data-panel="tab-stats"
          id="tab-btn-stats"
        >
          Profile Stats
        </button>
      </div>

      <!-- Tab: Contact Requests -->
      <div
        class="tab-panel active"
        id="tab-requests"
        role="tabpanel"
        aria-labelledby="tab-btn-requests"
      >
        <div id="contact-requests" class="requests-list" aria-live="polite" aria-label="Contact requests from clubs">
          <!-- Request cards injected by player.js -->
        </div>
      </div>

      <!-- Tab: My Videos -->
      <div
        class="tab-panel"
        id="tab-videos"
        role="tabpanel"
        aria-labelledby="tab-btn-videos"
      >
        <div id="videos-list" class="videos-grid" aria-label="Your highlight videos" aria-live="polite">
          <!-- Video cards injected by player.js -->
        </div>

        <button
          type="button"
          class="btn btn--ghost btn--sm"
          id="add-video-btn"
          aria-label="Upload a new highlight video"
        >
          &#9654; Upload Video
        </button>

        <input
          type="file"
          id="video-file-input"
          name="videos"
          accept="video/*"
          multiple
          class="sr-only"
          aria-label="Choose video files to upload"
        />
      </div>

      <!-- Tab: Profile Stats -->
      <div
        class="tab-panel"
        id="tab-stats"
        role="tabpanel"
        aria-labelledby="tab-btn-stats"
      >
        <div id="profile-views-chart" class="chart-placeholder" aria-label="Profile views over the last 30 days">
          <div class="chart-placeholder__icon" aria-hidden="true">&#128200;</div>
          <p class="chart-placeholder__label">Views in the last 30 days</p>
        </div>
      </div>

    </main>
  </div>

  <script src="/js/components.js"></script>
  <script src="/js/player.js"></script>
  <script>
    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var panelId = btn.getAttribute('data-panel');

        document.querySelectorAll('.tab-btn').forEach(function (b) {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
        });
        document.querySelectorAll('.tab-panel').forEach(function (p) {
          p.classList.remove('active');
        });

        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        var panel = document.getElementById(panelId);
        if (panel) panel.classList.add('active');
      });
    });

    // Sidebar videos link triggers videos tab
    var navVideosLink = document.getElementById('nav-videos-link');
    if (navVideosLink) {
      navVideosLink.addEventListener('click', function (e) {
        e.preventDefault();
        var videosTab = document.querySelector('[data-panel="tab-videos"]');
        if (videosTab) videosTab.click();
        document.getElementById('tab-videos').scrollIntoView({ behavior: 'smooth' });
      });
    }
  </script>
</body>
</html>
